name: Build WatchSuggester APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and Package APK
        run: |
          mkdir -p build/gen build/obj
          aapt package -f -m -J build/gen -M AndroidManifest.xml -S res -I $ANDROID_HOME/platforms/android-33/android.jar
          javac -cp $ANDROID_HOME/platforms/android-33/android.jar -d build/obj $(find src build/gen -name "*.java")
          d8 --output build/ $(find build/obj -name "*.class")
          aapt package -f -M AndroidManifest.xml -S res -A assets -I $ANDROID_HOME/platforms/android-33/android.jar -F build/unsigned.apk
          cd build && aapt add unsigned.apk classes.dex && cd ..
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=App,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --out WatchSuggester.apk build/unsigned.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchSuggester-APK
          path: WatchSuggester.apk
